# Fly.io deployment for the WhatsApp sender.
#
# The important parts are `auto_stop_machines = false` and the mounted volume:
# the session must stay connected between sends, and its keys must survive a
# redeploy, or you would be scanning a QR every time.

app = "wedding-whatsapp"
primary_region = "cdg"          # Paris — closest low-latency region to Israel

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  WA_SESSION_PATH = "/data/.wwebjs_auth"

# WhatsApp Web holds a persistent WebSocket. Sleeping the machine drops it.
[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# Session keys. Without this you re-scan the QR after every deploy.
[[mounts]]
  source = "wa_session"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"                # Chromium needs roughly 700 MB under load
